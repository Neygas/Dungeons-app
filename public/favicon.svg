<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#08101a"/>
      <stop offset="100%" stop-color="#040810"/>
    </radialGradient>
    <radialGradient id="iris" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#a0e8ff"/>
      <stop offset="35%" stop-color="#2080c0"/>
      <stop offset="70%" stop-color="#0a3a70"/>
      <stop offset="100%" stop-color="#020d20"/>
    </radialGradient>
    <radialGradient id="ambientglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#40aaff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#40aaff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="64" height="64" rx="12" fill="url(#bg)"/>

  <!-- Ambient glow behind eye -->
  <ellipse cx="32" cy="32" rx="22" ry="14" fill="url(#ambientglow)"/>

  <!-- Eyelid outer shape -->
  <path d="M6,32 Q18,12 32,12 Q46,12 58,32 Q46,52 32,52 Q18,52 6,32 Z"
        fill="#081828" stroke="#1a4a7a" stroke-width="1.2"/>

  <!-- Iris -->
  <ellipse cx="32" cy="32" rx="13" ry="13" fill="url(#iris)" filter="url(#glow)"/>

  <!-- Ice crack lines on iris -->
  <line x1="32" y1="19" x2="30" y2="27" stroke="#c0e8ff" stroke-width="0.6" opacity="0.5"/>
  <line x1="32" y1="19" x2="36" y2="26" stroke="#c0e8ff" stroke-width="0.6" opacity="0.4"/>
  <line x1="45" y1="32" x2="38" y2="34" stroke="#c0e8ff" stroke-width="0.6" opacity="0.4"/>
  <line x1="19" y1="32" x2="26" y2="30" stroke="#c0e8ff" stroke-width="0.6" opacity="0.4"/>

  <!-- Slit pupil -->
  <ellipse cx="32" cy="32" rx="2.5" ry="12" fill="#000c18"/>

  <!-- Pupil inner sheen -->
  <ellipse cx="32" cy="32" rx="1" ry="11" fill="#001428" opacity="0.5"/>

  <!-- Primary catchlight -->
  <ellipse cx="27" cy="26" rx="2.5" ry="1.5" fill="white" opacity="0.45" transform="rotate(-20,27,26)"/>

  <!-- Secondary micro-highlight -->
  <ellipse cx="35" cy="38" rx="1" ry="0.6" fill="white" opacity="0.2"/>

  <!-- Upper lid scale detail lines -->
  <path d="M10,27 Q16,18 24,15" stroke="#1a4a80" stroke-width="0.9" fill="none" opacity="0.8"/>
  <path d="M54,27 Q48,18 40,15" stroke="#1a4a80" stroke-width="0.9" fill="none" opacity="0.8"/>

  <!-- Upper lid frost edge -->
  <path d="M6,32 Q18,12 32,12 Q46,12 58,32"
        fill="none" stroke="#60b0ff" stroke-width="0.7" opacity="0.4"/>

  <!-- Lower lid edge -->
  <path d="M6,32 Q18,52 32,52 Q46,52 58,32"
        fill="none" stroke="#1a4a7a" stroke-width="0.6" opacity="0.5"/>
</svg>
